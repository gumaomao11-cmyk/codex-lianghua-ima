name: IMA Strategy Refresh (prices + list + email)

on:
  # 每天 05:40 北京时间自动跑；也可手动触发
  schedule:
    - cron: '40 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ima-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install --quiet -r requirements.txt

      - name: Update stock prices
        env:
          STOCK_DATA_DIR: ${{ github.workspace }}/data
        run: python update_prices_wide.py

      - name: Update ETF reference
        env:
          STOCK_DATA_DIR: ${{ github.workspace }}/data
        run: python update_etf_ref.py

      - name: Reselect IMA target list
        env:
          STOCK_DATA_DIR: ${{ github.workspace }}/data
        run: python select_ima_final.py

      - name: Run IMA daily report + email
        env:
          ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_ENDPOINT:   https://paper-api.alpaca.markets
          QQ_MAIL_AUTH_CODE: ${{ secrets.QQ_MAIL_AUTH_CODE }}
          QQ_MAIL_FROM:      869357594@qq.com
          QQ_MAIL_TO:        869357594@qq.com
          STOCK_DATA_DIR:    ${{ github.workspace }}/data
          ETFS_REF_FILE:     ${{ github.workspace }}/data/etf-ref.csv
          PAPER_TARGET_EQUITY: "20000"
        run: python auto_run_ima.py

      - name: Commit & push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "chore(ima): auto-refresh $(date -u +%Y-%m-%d)"
            git pull --rebase origin main || true
            git push origin HEAD:main
          else
            echo "no data changes"
          fi

      - name: Notify failure (WeChat + email)
        if: failure()
        env:
          WECHAT_SEND_KEY:   ${{ secrets.WECHAT_SEND_KEY }}
          QQ_MAIL_AUTH_CODE: ${{ secrets.QQ_MAIL_AUTH_CODE }}
          QQ_MAIL_FROM:      869357594@qq.com
          QQ_MAIL_TO:        869357594@qq.com
        run: |
          bash .github/notify_fail.sh "IMA Refresh 跑挂" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
