name: IMA Strategy Daily

on:
  # 21:40 UTC = 次日 05:40 北京时间（美股收盘 16:00 ET 后约 1.7 小时）
  schedule:
    - cron: '40 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ima-strategy-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install --quiet -r requirements.txt

      - name: Run IMA strategy daily report + email
        env:
          ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_ENDPOINT:   https://paper-api.alpaca.markets
          QQ_MAIL_AUTH_CODE: ${{ secrets.QQ_MAIL_AUTH_CODE }}
          QQ_MAIL_FROM:      869357594@qq.com
          QQ_MAIL_TO:        869357594@qq.com
          STOCK_DATA_DIR:    ${{ github.workspace }}/data
          ETFS_REF_FILE:     ${{ github.workspace }}/data/etf-ref.csv
          PAPER_TARGET_EQUITY: "20000"
        run: python auto_run_ima.py


      - name: Commit & push IMA state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ima/paper_log_ima.csv data/ima/paper_state_ima.json data/ima/ima_orders.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(ima): auto-update $(date -u +%Y-%m-%d)"
            git pull --rebase origin main || true
            git push origin HEAD:main
          else
            echo "no changes"
          fi
      - name: Notify failure (WeChat + email)
        if: failure()
        env:
          WECHAT_SEND_KEY:   ${{ secrets.WECHAT_SEND_KEY }}
          QQ_MAIL_AUTH_CODE: ${{ secrets.QQ_MAIL_AUTH_CODE }}
          QQ_MAIL_FROM:      869357594@qq.com
          QQ_MAIL_TO:        869357594@qq.com
        run: |
          bash .github/notify_fail.sh "IMA Strategy Daily 跑挂" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

